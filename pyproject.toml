[project]
name = "crypto-market"
version = "0.1.0"
description = "Is BTC ever cheaper on one exchange than another, for long enough to catch?"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "pandas>=2.2",
    "websockets>=12",
]

[project.scripts]
crypto-market = "crypto_market.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crypto_market"]
